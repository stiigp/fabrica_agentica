## Coordenacao dos dois transportes

- As duas secoes acima sao obrigatorias na mesma execucao. Salve os artefatos e execute uma unica vez `scripts/notificar-fabrica.ps1` com os mesmos argumentos de agente, feature, etapa, status, resumo, artefato e `ExecucaoId` recebido no handoff. O padrao envia a Slack e Discord; nao execute os adaptadores novamente depois do envio conjunto.
- O script tenta ambos independentemente, mesmo se um falhar. Copie a evidencia de cada bloco `TRANSPORTE: slack_bot_api` e `TRANSPORTE: discord_webhook` antes do bloco final de retorno. A confirmacao de um servico nao comprova o outro.
- Preserve os sucessos e informe somente as pendencias em `BLOQUEIOS`, sem mudar o resultado tecnico nem repetir a tarefa. Se o orquestrador solicitar retomada de um transporte, use `-Transportes slack` ou `-Transportes discord` e o mesmo `ExecucaoId`; nunca reenvie ao transporte ja confirmado.
- Se houver timeout, solicite a conferencia do canal pelo orquestrador antes de reenviar. Mantenha o resumo curto para caber tambem no limite de 2000 caracteres do Discord. Nunca imprima tokens ou URL do webhook.

## Formato de retorno
Encerre sempre com exatamente este bloco, sem substituí-lo por prosa livre (o resumo pedido nas regras vem antes dele):

```text
